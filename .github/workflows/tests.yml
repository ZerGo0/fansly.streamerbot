name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Fansly.Streamerbot.Tests/Fansly.Streamerbot.Tests.csproj

      - name: Test
        run: dotnet test tests/Fansly.Streamerbot.Tests/Fansly.Streamerbot.Tests.csproj --configuration Release --no-restore
